name: Restore upstream Mobile Codex v0.3.9 source

on:
  push:
    paths:
      - ".github/workflows/restore-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-upstream-source
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'caizhiyuan72/mobile-codex-zh'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Fetch and verify the exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit=b6c12eb65fd29a38b0c2825bf12a7aca64736c5a
          temp_dir="$(mktemp -d)"
          git clone --depth 1 --single-branch --branch v0.3.9 \
            https://github.com/nokryong/mobile-codex.git "$temp_dir/original"
          actual="$(git -C "$temp_dir/original" rev-parse HEAD)"
          if [ "$actual" != "$upstream_commit" ]; then
            echo "::error::Upstream commit differs from pinned v0.3.9; refusing to import"
            exit 1
          fi

          mkdir -p upstream-source
          tar -C "$temp_dir/original" --exclude='./.git' -cf - . | tar -C upstream-source -xf -
          printf '%s\n' "$upstream_commit" > upstream-source/.upstream-commit
          printf '%s\n' "https://github.com/nokryong/mobile-codex/tree/v0.3.9" > upstream-source/.upstream-source

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f upstream-source
          if git diff --cached --quiet; then
            echo 'Exact upstream source was already imported.'
            exit 0
          fi
          git commit -m "Vendor full verified upstream v0.3.9 source [skip ci]"
          git push origin HEAD:main
          echo "Imported source snapshot from upstream commit $upstream_commit"
