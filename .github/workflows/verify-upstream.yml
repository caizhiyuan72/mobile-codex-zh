name: Verify restored upstream source

on:
  push:
    paths:
      - ".github/workflows/verify-upstream.yml"
      - "upstream-source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: upstream-source
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check pinned upstream commit identity
        run: |
          set -euo pipefail
          test "$(cat .upstream-commit)" = b6c12eb65fd29a38b0c2825bf12a7aca64736c5a
          test -f app/build.gradle
          test -f tools/prepare_runtime.py
          test -f LICENSE
      - name: Install Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install frontend test dependencies
        run: npm ci --ignore-scripts
      - name: Test restored upstream JavaScript
        run: npm test
