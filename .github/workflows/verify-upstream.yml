name: Verify upstream provenance

on:
  push:
    paths:
      - ".github/workflows/verify-upstream.yml"
      - "upstream-source/.upstream-commit"
      - "upstream-source/.upstream-source"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: upstream-source
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check the recorded baseline (the source contains fork changes)
        run: |
          set -euo pipefail
          test "$(cat .upstream-commit)" = b6c12eb65fd29a38b0c2825bf12a7aca64736c5a
          test -f app/build.gradle
          test -f tools/prepare_runtime.py
          test -f LICENSE
